name: TVE Pipedrive Daily Report

on:
  # 7:09 UTC = 4:09am Argentina (GMT-3). Se dispara temprano y con minuto
  # no redondo a proposito: los schedules de GitHub Actions son best-effort
  # y suelen atrasarse 3-6hs, sobre todo en horarios en punto (:00). El
  # reporte igual cubre el dia calendario anterior completo sin importar
  # a que hora corra, asi que arrancar temprano solo ayuda a que el
  # atraso caiga lo mas cerca posible de la mañana.
  schedule:
    - cron: "9 7 * * *"

  # Trigger manual para testing
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          PIPEDRIVE_API_TOKEN:   ${{ secrets.PIPEDRIVE_API_TOKEN }}
          PIPEDRIVE_DOMAIN:      ${{ secrets.PIPEDRIVE_DOMAIN }}
          TELEGRAM_BOT_TOKEN_CRM: ${{ secrets.TELEGRAM_BOT_TOKEN_CRM }}
          TELEGRAM_CHAT_ID_CRM:   ${{ secrets.TELEGRAM_CHAT_ID_CRM }}
        run: python agent.py
